<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#FBF9F6"/>
  <defs>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#b8962e"/>
    </linearGradient>
    <linearGradient id="navy-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2847"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2847" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg-grad)"/>
  <!-- Title -->
  <text x="400" y="35" font-family="Georgia, serif" font-size="18" fill="#0F2847" text-anchor="middle" font-weight="bold" letter-spacing="3">YOUR NETWORK TREE</text>
  <line x1="280" y1="45" x2="520" y2="45" stroke="#0EA5E9" stroke-width="1.5"/>
  <!-- Root node (you) -->
  <circle cx="400" cy="90" r="25" fill="url(#navy-grad)"/>
  <circle cx="400" cy="90" r="22" fill="none" stroke="#0EA5E9" stroke-width="2.5"/>
  <text x="400" y="95" font-family="Arial, sans-serif" font-size="10" fill="#0EA5E9" text-anchor="middle" font-weight="bold">YOU</text>
  <!-- Level 1 labels -->
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="9" fill="#0F2847" text-anchor="middle" opacity="0.5">Level 1</text>
  <!-- Connecting lines L1 -->
  <line x1="400" y1="115" x2="400" y2="140" stroke="#0EA5E9" stroke-width="1.5" opacity="0.5"/>
  <line x1="400" y1="140" x2="200" y2="155" stroke="#0EA5E9" stroke-width="1.5" opacity="0.5"/>
  <line x1="400" y1="140" x2="600" y2="155" stroke="#0EA5E9" stroke-width="1.5" opacity="0.5"/>
  <!-- L1 nodes -->
  <circle cx="200" cy="180" r="20" fill="url(#gold-grad)"/>
  <circle cx="200" cy="180" r="17" fill="none" stroke="#0F2847" stroke-width="1.5"/>
  <text x="200" y="184" font-family="Arial, sans-serif" font-size="9" fill="#0F2847" text-anchor="middle" font-weight="bold">L1</text>
  <circle cx="600" cy="180" r="20" fill="url(#gold-grad)"/>
  <circle cx="600" cy="180" r="17" fill="none" stroke="#0F2847" stroke-width="1.5"/>
  <text x="600" y="184" font-family="Arial, sans-serif" font-size="9" fill="#0F2847" text-anchor="middle" font-weight="bold">L1</text>
  <!-- Level 2 labels -->
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="8" fill="#0F2847" text-anchor="middle" opacity="0.4">Level 2</text>
  <text x="600" y="210" font-family="Arial, sans-serif" font-size="8" fill="#0F2847" text-anchor="middle" opacity="0.4">Level 2</text>
  <!-- Connecting lines L2 -->
  <line x1="200" y1="200" x2="200" y2="220" stroke="#0EA5E9" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="220" x2="100" y2="235" stroke="#0EA5E9" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="220" x2="300" y2="235" stroke="#0EA5E9" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="200" x2="600" y2="220" stroke="#0EA5E9" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="220" x2="500" y2="235" stroke="#0EA5E9" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="220" x2="700" y2="235" stroke="#0EA5E9" stroke-width="1" opacity="0.4"/>
  <!-- L2 nodes -->
  <circle cx="100" cy="258" r="15" fill="#0F2847" opacity="0.7"/>
  <circle cx="100" cy="258" r="12" fill="none" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="100" y="262" font-family="Arial, sans-serif" font-size="8" fill="#0EA5E9" text-anchor="middle">L2</text>
  <circle cx="300" cy="258" r="15" fill="#0F2847" opacity="0.7"/>
  <circle cx="300" cy="258" r="12" fill="none" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="300" y="262" font-family="Arial, sans-serif" font-size="8" fill="#0EA5E9" text-anchor="middle">L2</text>
  <circle cx="500" cy="258" r="15" fill="#0F2847" opacity="0.7"/>
  <circle cx="500" cy="258" r="12" fill="none" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="500" y="262" font-family="Arial, sans-serif" font-size="8" fill="#0EA5E9" text-anchor="middle">L2</text>
  <circle cx="700" cy="258" r="15" fill="#0F2847" opacity="0.7"/>
  <circle cx="700" cy="258" r="12" fill="none" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="700" y="262" font-family="Arial, sans-serif" font-size="8" fill="#0EA5E9" text-anchor="middle">L2</text>
  <!-- Connecting lines L3 -->
  <line x1="100" y1="273" x2="100" y2="288" stroke="#0EA5E9" stroke-width="0.8" opacity="0.3"/>
  <line x1="100" y1="288" x2="60" y2="300" stroke="#0EA5E9" stroke-width="0.8" opacity="0.3"/>
  <line x1="100" y1="288" x2="140" y2="300" stroke="#0EA5E9" stroke-width="0.8" opacity="0.3"/>
  <line x1="300" y1="273" x2="300" y2="288" stroke="#0EA5E9" stroke-width="0.8" opacity="0.3"/>
  <line x1="300" y1="288" x2="260" y2="300" stroke="#0EA5E9" stroke-width="0.8" opacity="0.3"/>
  <line x1="300" y1="288" x2="340" y2="300" stroke="#0EA5E9" stroke-width="0.8" opacity="0.3"/>
  <!-- L3 leaf nodes -->
  <circle cx="60" cy="320" r="10" fill="none" stroke="#0F2847" stroke-width="1" opacity="0.4"/>
  <circle cx="140" cy="320" r="10" fill="none" stroke="#0F2847" stroke-width="1" opacity="0.4"/>
  <circle cx="260" cy="320" r="10" fill="none" stroke="#0F2847" stroke-width="1" opacity="0.4"/>
  <circle cx="340" cy="320" r="10" fill="none" stroke="#0F2847" stroke-width="1" opacity="0.4"/>
  <!-- Additional L3 from right side -->
  <line x1="500" y1="273" x2="500" y2="288" stroke="#0EA5E9" stroke-width="0.8" opacity="0.3"/>
  <line x1="500" y1="288" x2="460" y2="300" stroke="#0EA5E9" stroke-width="0.8" opacity="0.3"/>
  <line x1="500" y1="288" x2="540" y2="300" stroke="#0EA5E9" stroke-width="0.8" opacity="0.3"/>
  <circle cx="460" cy="320" r="10" fill="none" stroke="#0F2847" stroke-width="1" opacity="0.4"/>
  <circle cx="540" cy="320" r="10" fill="none" stroke="#0F2847" stroke-width="1" opacity="0.4"/>
  <!-- Decorative nodes (faded, distant) -->
  <line x1="60" y1="330" x2="40" y2="345" stroke="#0EA5E9" stroke-width="0.5" opacity="0.2"/>
  <line x1="140" y1="330" x2="160" y2="345" stroke="#0EA5E9" stroke-width="0.5" opacity="0.2"/>
  <circle cx="40" cy="360" r="6" fill="none" stroke="#0F2847" stroke-width="0.5" opacity="0.2"/>
  <circle cx="160" cy="360" r="6" fill="none" stroke="#0F2847" stroke-width="0.5" opacity="0.2"/>
  <!-- Decorative gold elements -->
  <circle cx="750" cy="60" r="40" fill="#0EA5E9" opacity="0.06"/>
  <circle cx="50" cy="350" r="50" fill="#0EA5E9" opacity="0.05"/>
  <!-- Stats bar at bottom -->
  <rect x="180" y="365" width="440" height="28" rx="14" fill="#0F2847" opacity="0.85"/>
  <text x="220" y="383" font-family="Arial, sans-serif" font-size="11" fill="#0EA5E9">Team Size: 24</text>
  <line x1="330" y1="370" x2="330" y2="390" stroke="#0EA5E9" stroke-width="0.5" opacity="0.5"/>
  <text x="380" y="383" font-family="Arial, sans-serif" font-size="11" fill="#0EA5E9">Levels: 3</text>
  <line x1="480" y1="370" x2="480" y2="390" stroke="#0EA5E9" stroke-width="0.5" opacity="0.5"/>
  <text x="530" y="383" font-family="Arial, sans-serif" font-size="11" fill="#0EA5E9">Growth: +5 this week</text>
</svg>