  <rect x="285" y="290" width="18" height="45" rx="2" fill="#0F2847" opacity="0.8"/>
  <rect x="320" y="265" width="18" height="70" rx="2" fill="#0EA5E9" opacity="0.7"/>
  <rect x="355" y="280" width="18" height="55" rx="2" fill="#0F2847" opacity="0.9"/>
