<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#FBF9F6"/>
  <defs>
    <linearGradient id="db-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2847"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="chart-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.1"/>
